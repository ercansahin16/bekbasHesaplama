<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Çalış 10 - Fire / Verim Hesabı</title>
  <link rel="icon" type="image/jpeg" href="../icon1.jpg">
  <link rel="stylesheet" href="../style.css?v=202610201211">
  <script>try{if(localStorage.getItem('bekbas-theme')==='dark')document.documentElement.classList.add('pre-dark')}catch(e){}</script>
</head>
<body>
  <div class="wrap">
    <div class="sticky-head">
    <header class="topbar">
      <a class="brand" href="../index.html" style="color:inherit;text-decoration:none">
        <img src="../bekbas.png" alt="Bekbaş">
        <div class="brand-text">
          <div class="brand-sub">Hızlı Hesaplamalar</div>
          <div class="brand-title">Bekbaş Gıda San. Tic. A.Ş.</div>
        </div>
      </a>
      <div class="top-actions">
        <button class="icon-btn" onclick="toggleTheme()" title="Tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
      <a class="icon-btn" href="../index.html" title="Ana Sayfa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/></svg></a>
      </div>
    </header>

    </div>

    <main class="grid">
      <section class="card wide" data-calc="fire" data-tags="fire verim kayıp brüt net kg gerçek maliyet fire oranı kesim temizleme">
        <div class="card-head">
          <div>
            <div class="card-kicker">Çalış 10</div>
            <h2 class="card-title">Fire / Verim Hesabı</h2>
          </div>
          <div class="card-tools">
            <button class="tool-btn info" title="Açıklama"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
            <button class="tool-btn reset" title="Sıfırla"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg></button>
          </div>
        </div>
        <p class="desc">Brüt ve net kg'dan fire ve verim oranını bulur. KG fiyatı girilirse fire düşüldükten sonraki gerçek kg maliyetini hesaplar.</p>
        <div class="panel row">
          <div class="field md">
            <label>Brüt (kg)</label>
            <input type="number" inputmode="decimal" step="any" data-key="brut" placeholder="0" autofocus>
          </div>
          <div class="field md">
            <label>Net (kg)</label>
            <input type="number" inputmode="decimal" step="any" data-key="net" placeholder="0">
          </div>
          <div class="field md">
            <label>KG Fiyatı (₺)</label>
            <input type="number" inputmode="decimal" step="any" data-key="fiyat" placeholder="0">
          </div>
          <span class="op">=</span>
          <div class="result inline"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="../app.js?v=202610201211"></script>
</body>
</html>
